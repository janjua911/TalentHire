[theme]
primaryColor = "#667eea"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1e1e2e"
textColor = "#ffffff"
font = "sans serif"

[server]
maxUploadSize = 20
enableXsrfProtection = true
enableCORS = false

[browser]
gatherUsageStats = false

[logger]
level = "info"

[runner]
magicEnabled = false
